name: Data Assets

on:
  push:
    branches: [main]
    paths:
      - src/bin/Data/**
      - src/bin/fonts/**
      - .github/workflows/data-assets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-data:
    name: Publish data asset
    # Upstream stays neutral: only forks opt in by setting this variable.
    if: vars.DISTRIBUTION_ENABLED == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and identify data
        shell: bash
        run: |
          test -f src/bin/Data/Dec2.dat
          test -f src/bin/fonts/DejaVuSans.ttf

          data_tree=$(git rev-parse HEAD:src/bin/Data)
          fonts_tree=$(git rev-parse HEAD:src/bin/fonts)
          asset_id=$(printf '%s\n%s\n' "$data_tree" "$fonts_tree" | sha256sum | cut -c1-16)

          {
            echo "asset_id=${asset_id}"
            echo "archive=MuMain-data-${asset_id}.tar.gz"
            echo "tag=data-${asset_id}"
          } >> "$GITHUB_ENV"

      - name: Archive and checksum data
        shell: bash
        run: |
          data_timestamp=$(git log -1 --format=%ct -- src/bin/Data src/bin/fonts)
          tar -czf "$archive" \
            --sort=name \
            --mtime="@${data_timestamp}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C src/bin Data fonts
          sha256sum "$archive" > "${archive}.sha256"
          sha256sum --check "${archive}.sha256"

      - name: Build zsync control file
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y zsync
          # Point clients at the stable GitHub download URL so the same
          # control file works regardless of which release hosts the asset.
          zsyncmake "$archive" \
            -o "$archive.zsync" \
            -u "https://github.com/ffuhr91/MuMain/releases/latest/download/$archive"

      - name: Build data manifest
        shell: bash
        run: |
          data_sha256=$(sha256sum "$archive" | cut -d' ' -f1)
          data_size=$(stat -c '%s' "$archive")
          {
            printf '{\n'
            printf '  "id": "%s",\n' "$asset_id"
            printf '  "tag": "%s",\n' "$tag"
            printf '  "archive": "%s",\n' "$archive"
            printf '  "url": "https://github.com/ffuhr91/MuMain/releases/latest/download/%s",\n' "$archive"
            printf '  "sha256": "%s",\n' "$data_sha256"
            printf '  "size": %s\n' "$data_size"
            printf '}\n'
          } > data.json
          cat data.json

      - name: Publish data release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "MuMain data ${asset_id}" \
              --notes "Content-addressed Data/ and fonts/ for MuMain runtime releases." \
              --latest=false
          fi
          gh release upload "$tag" "$archive" "${archive}.sha256" "$archive.zsync" data.json --clobber
